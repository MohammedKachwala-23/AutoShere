<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Delete Car | Autosphere</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body>

<div class="dashboard-container">
  <aside class="sidebar">
    <div>
      <div class="logo">
        <img src="{{ url_for('static', filename='css/logo.png') }}" alt="Autosphere Logo" />
        <h2>AUTOSPHERE</h2>
      </div>
      <nav>
        <a href="{{ url_for('admin_dashboard') }}"><i class="fas fa-cogs"></i> Admin</a>
        <a href="{{ url_for('view_inventory') }}"><i class="fas fa-car"></i> View Inventory</a>
        <a href="{{ url_for('delete_car') }}"><i class="fas fa-trash-alt"></i> Delete Car</a>
        <a href="{{ url_for('logout') }}"><i class="fas fa-sign-out-alt"></i> Logout</a>
      </nav>
    </div>
  </aside>

  <main class="dashboard-main">
    <header>
      <h1>Delete Car</h1>
      <p>Select a car to delete from the inventory.</p>
    </header>

    <section class="admin-form">
      <form action="{{ url_for('delete_car') }}" method="POST">
  <label for="car_id">Select Car to Delete:</label>
  <select name="car_id" id="car_id" required>
    {% for car in cars %}
      <option value="{{ car['id'] }}">{{ car['make'] }} {{ car['model'] }} ({{ car['year'] }})</option>
    {% endfor %}
  </select>

  <button type="submit">Delete Car</button>
</form>


    </section>
  </main>
</div>

</body>
</html>
